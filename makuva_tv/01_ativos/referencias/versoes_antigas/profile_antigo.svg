<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo verde -->
  <rect width="800" height="800" fill="#008000"/>

  <!-- Círculo amarelo atrás -->
  <circle cx="400" cy="400" r="340" fill="#FFCD00"/>

  <!-- Círculo vermelho interno -->
  <circle cx="400" cy="400" r="260" fill="#CE1126"/>

  <!-- Palitinho branco no centro -->
  <!-- Cabeça -->
  <circle cx="400" cy="320" r="45" fill="none" stroke="#FFFFFF" stroke-width="12"/>
  <!-- Corpo -->
  <line x1="400" y1="365" x2="400" y2="520" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <!-- Braços -->
  <line x1="400" y1="400" x2="320" y2="460" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <line x1="400" y1="400" x2="480" y2="460" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <!-- Pernas -->
  <line x1="400" y1="520" x2="350" y2="620" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <line x1="400" y1="520" x2="450" y2="620" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>

  <!-- Texto MAKUVA TV -->
  <text x="400" y="720" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MAKUVA TV</text>
</svg>
