<svg width="2560" height="1440" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B3D2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#072A20;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fundo gradiente verde escuro -->
  <rect width="2560" height="1440" fill="url(#gradBanner)"/>

  <!-- Faixa dourada superior -->
  <rect x="0" y="0" width="2560" height="12" fill="#D4A017"/>

  <!-- Área segura central (texto fica visível em todos os dispositivos) -->
  <rect x="507" y="508" width="1546" height="423" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="20,20" opacity="0.25"/>

  <!-- Símbolo M grande à esquerda da área segura -->
  <g transform="translate(750, 720) scale(2.2)">
    <rect x="-30" y="-180" width="24" height="360" fill="#FFFFFF"/>
    <rect x="-8" y="-60" width="24" height="120" fill="#D4A017"/>
    <rect x="16" y="-180" width="24" height="360" fill="#FFFFFF"/>
  </g>

  <!-- Texto MAKUVA TV -->
  <text x="1100" y="700" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="190" font-weight="900" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle" letter-spacing="12">MAKUVA</text>
  <text x="1100" y="880" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="190" font-weight="900" fill="#D4A017" text-anchor="start" dominant-baseline="middle" letter-spacing="12">TV</text>

  <!-- Subtítulo -->
  <text x="1100" y="1020" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="400" fill="#B9CBC6" text-anchor="start" letter-spacing="2">Piadas e memes de Moçambique</text>

  <!-- Linha de destaque -->
  <rect x="1100" y="1080" width="140" height="12" fill="#D4A017"/>
</svg>
